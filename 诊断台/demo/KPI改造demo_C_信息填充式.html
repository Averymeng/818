<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Demo C - 信息填充式</title>
<style>
:root{--bg:#F8F9FC;--card:#FFFFFF;--ink:#1F2937;--sub:#94A3B8;--line:#E9EDF5;--blue:#3B9DFF;--green:#32D583;--red:#F97066;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:var(--bg);padding:40px;color:var(--ink);}
.wrap{max-width:1100px;margin:0 auto;}
h1{font-size:18px;margin-bottom:8px;}
.sub{color:var(--sub);font-size:13px;margin-bottom:24px;}
/* 方案 C：信息填充式 */
.kpi-row-c{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.kpi-c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:120px;}
.kpi-c .top{display:flex;justify-content:space-between;align-items:flex-start;}
.kpi-c .lab{font-size:12px;color:var(--sub);font-weight:700;}
.kpi-c .delta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:#F1F5F9;color:var(--sub);}
.kpi-c .delta.up{background:#D1FADF;color:#027A48;}
.kpi-c .delta.down{background:#FEE4E2;color:#B42318;}
.kpi-c .v{font-size:26px;font-weight:800;letter-spacing:-.3px;}
.kpi-c .row2{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);}
.kpi-c .row2 b{color:var(--ink);font-weight:800;}
.kpi-c .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
.kpi-c .bar i{display:block;height:100%;border-radius:99px;}
.kpi-c .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:auto;}
</style>
</head>
<body>
<div class="wrap">
  <h1>方案 C：信息填充式</h1>
  <div class="sub">保持三列等高，但增加二级指标（昨日值、周累计占比、目标进度条）填充空白，信息密度更高。</div>
  <div class="kpi-row-c">
    <div class="kpi-c">
      <div class="top"><div class="lab">总消耗</div><div class="delta down">▼ 0.8%</div></div>
      <div class="v">¥102,132</div>
      <div class="row2"><span>昨日 <b>¥102,907</b></span><span>本周累计 <b>¥69.5万</b></span></div>
      <div class="bar"><i style="width:68%;background:var(--blue)"></i></div>
      <div class="foot"><span>周目标 ¥100万</span><span>完成 69.5%</span></div>
    </div>
    <div class="kpi-c">
      <div class="top"><div class="lab">留资数</div><div class="delta up">▲ 0.1%</div></div>
      <div class="v">1,658</div>
      <div class="row2"><span>昨日 <b>1,657</b></span><span>本周累计 <b>11,260</b></span></div>
      <div class="bar"><i style="width:75%;background:var(--green)"></i></div>
      <div class="foot"><span>周目标 15,000</span><span>完成 75.1%</span></div>
    </div>
    <div class="kpi-c">
      <div class="top"><div class="lab">留资成本</div><div class="delta up">▲ 0.1%</div></div>
      <div class="v">¥62</div>
      <div class="row2"><span>昨日 <b>¥62</b></span><span>周均值 <b>¥61</b></span></div>
      <div class="bar"><i style="width:82%;background:var(--red)"></i></div>
      <div class="foot"><span>目标上限 ¥75</span><span>剩余空间 17%</span></div>
    </div>
  </div>
</div>
</body>
</html>
