<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Demo A - 紧凑图标式</title>
<style>
:root{--bg:#F8F9FC;--card:#FFFFFF;--ink:#1F2937;--sub:#94A3B8;--line:#E9EDF5;--blue:#3B9DFF;--green:#32D583;--red:#F97066;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:var(--bg);padding:40px;color:var(--ink);}
.wrap{max-width:1100px;margin:0 auto;}
h1{font-size:18px;margin-bottom:8px;}
.sub{color:var(--sub);font-size:13px;margin-bottom:24px;}
/* 方案 A：紧凑图标式 */
.kpi-row-a{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.kpi-a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;min-height:76px;}
.kpi-a .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.kpi-a.spend .ico{background:#E8F4FF;}
.kpi-a.lead .ico{background:#E6F9F0;}
.kpi-a.cpl .ico{background:#FFF4E5;}
.kpi-a .body{flex:1;min-width:0;}
.kpi-a .lab{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:2px;}
.kpi-a .main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.kpi-a .v{font-size:22px;font-weight:800;letter-spacing:-.3px;}
.kpi-a .delta{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:#F1F5F9;color:var(--sub);}
.kpi-a .delta.up{background:#D1FADF;color:#027A48;}
.kpi-a .delta.down{background:#FEE4E2;color:#B42318;}
</style>
</head>
<body>
<div class="wrap">
  <h1>方案 A：紧凑图标式</h1>
  <div class="sub">降低卡片高度，左侧用色块图标强化识别，内容横向排布，适合顶部常驻 KPI 条。</div>
  <div class="kpi-row-a">
    <div class="kpi-a spend">
      <div class="ico">💰</div>
      <div class="body">
        <div class="lab">总消耗</div>
        <div class="main"><span class="v">¥102,132</span><span class="delta down">▼ 0.8%</span></div>
      </div>
    </div>
    <div class="kpi-a lead">
      <div class="ico">🎯</div>
      <div class="body">
        <div class="lab">留资数</div>
        <div class="main"><span class="v">1,658</span><span class="delta up">▲ 0.1%</span></div>
      </div>
    </div>
    <div class="kpi-a cpl">
      <div class="ico">📉</div>
      <div class="body">
        <div class="lab">留资成本</div>
        <div class="main"><span class="v">¥62</span><span class="delta up">▲ 0.1%</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
