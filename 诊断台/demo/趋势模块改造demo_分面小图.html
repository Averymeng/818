<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>趋势模块改造 demo · 分面小图</title>
<style>
  :root{
    --bg:#F5F7FA; --card:#FFF; --ink:#1F2937; --sub:#6B7280; --line:#E5E7EB;
    --blue:#3B9DFF; --cyan:#22D3EE; --yellow:#FDB022;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);padding:24px;}
  .wrap{max-width:1080px;margin:0 auto;}
  .note{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.7;}
  .card{background:var(--card);border-radius:14px;box-shadow:0 6px 18px rgba(31,41,55,.06);padding:18px 20px;}
  .card .t{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .mini{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FAFBFD;}
  .mini .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .mini .name{font-size:12px;font-weight:800;color:var(--sub);}
  .mini .cur{font-size:16px;font-weight:800;}
  .mini .sub{font-size:10px;color:var(--sub);margin-top:2px;}
  svg{display:block;width:100%;height:132px;}
  .axis{font-size:8px;fill:#94A3B8;}
  .avg{stroke:#9CA3AF;stroke-width:1;stroke-dasharray:4 3;}
  .dot-last{fill:#FFF;stroke-width:2.5;}
  @media (max-width:860px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="note">
    改造思路：不把 3 条不同量纲的线硬叠在一张图里（现在的问题是每条线各自归一化，Y 轴读不出真实值），
    改为 <b>分面小图</b>——每个指标一张独立小图，各自带真实 Y 轴刻度和均值参考线，一眼能看出量级和走势。
    数据为 8-07 ~ 8-20 全量客户实测快照。
  </div>

  <div class="card">
    <div class="t">趋势（近14天 · 分指标）</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
  // 真实 DB 快照：8-07 ~ 8-20 全量客户每日汇总
  const RAW = [
    {d:"08-07", spend:98775.41,  lead:1584, open:7827},
    {d:"08-08", spend:117498.08, lead:1884, open:9357},
    {d:"08-09", spend:117750.18, lead:1853, open:9131},
    {d:"08-10", spend:98631.98,  lead:1453, open:7211},
    {d:"08-11", spend:99632.36,  lead:1530, open:7317},
    {d:"08-12", spend:99195.74,  lead:1510, open:7189},
    {d:"08-13", spend:98294.40,  lead:1493, open:7228},
    {d:"08-14", spend:99295.12,  lead:1518, open:7330},
    {d:"08-15", spend:114408.24, lead:1702, open:8465},
    {d:"08-16", spend:115374.53, lead:1759, open:8732},
    {d:"08-17", spend:99807.55,  lead:1628, open:7493},
    {d:"08-18", spend:100347.94, lead:1616, open:7446},
    {d:"08-19", spend:102906.55, lead:1657, open:7553},
    {d:"08-20", spend:102132.12, lead:1658, open:7673},
  ];
  const SERIES = [
    {name:"消耗",      color:"#3B9DFF", unit:"¥",  vals:RAW.map(r=>r.spend)},
    {name:"留资成本",  color:"#22D3EE", unit:"¥",  vals:RAW.map(r=>r.spend/r.lead)},
    {name:"开口成本",  color:"#FDB022", unit:"¥",  vals:RAW.map(r=>r.spend/r.open)},
  ];

  function fmt(v){
    if(v>=10000) return (v/10000).toFixed(1)+"万";
    if(v>=100) return Math.round(v).toLocaleString();
    return v.toFixed(1);
  }

  function miniSVG(s){
    const W=240,H=132,PL=34,PR=8,PT=10,PB=18;
    const w=W-PL-PR, h=H-PT-PB;
    const mx=Math.max(...s.vals), mn=Math.min(...s.vals), rng=(mx-mn)||1;
    const X=i=>PL+(s.vals.length===1?w/2:i*w/(s.vals.length-1));
    const Y=v=>PT+h-((v-mn)/rng)*h;
    const pts=s.vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
    const avg=s.vals.reduce((a,b)=>a+b,0)/s.vals.length;
    const avgY=Y(avg);
    // x 轴稀疏刻度
    const tickIdx=[]; const step=3;
    for(let i=0;i<RAW.length;i+=step) tickIdx.push(i);
    if(tickIdx[tickIdx.length-1]!==RAW.length-1) tickIdx.push(RAW.length-1);
    const xT=tickIdx.map(i=>`<text class="axis" x="${X(i).toFixed(1)}" y="${(PT+h+12).toFixed(1)}" text-anchor="middle">${RAW[i].d}</text>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}">
      <line x1="${PL}" y1="${PT+h}" x2="${PL+w}" y2="${PT+h}" stroke="#E9EDF5"/>
      <line class="avg" x1="${PL}" y1="${avgY.toFixed(1)}" x2="${PL+w}" y2="${avgY.toFixed(1)}"/>
      <polygon points="${pts} ${PL+w},${PT+h} ${PL},${PT+h}" fill="${s.color}" opacity="0.08"/>
      <polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="dot-last" cx="${X(s.vals.length-1).toFixed(1)}" cy="${Y(s.vals[s.vals.length-1]).toFixed(1)}" r="3.2" stroke="${s.color}"/>
      <text class="axis" x="${PL-4}" y="${(PT+7).toFixed(1)}" text-anchor="end">${fmt(mx)}</text>
      <text class="axis" x="${PL-4}" y="${(PT+h+3).toFixed(1)}" text-anchor="end">${fmt(mn)}</text>
      ${xT}
    </svg>`;
  }

  document.getElementById("grid").innerHTML = SERIES.map(s=>{
    const last=s.vals[s.vals.length-1];
    const avg=s.vals.reduce((a,b)=>a+b,0)/s.vals.length;
    const d=+(((last-avg)/avg)*100).toFixed(1);
    return `<div class="mini">
      <div class="head">
        <div class="name">${s.name}</div>
        <div class="cur" style="color:${s.color}">¥${fmt(last)}</div>
      </div>
      <div class="sub">14天均值 ¥${fmt(avg)} · 较均值 ${d>=0?"+":""}${d}%</div>
      ${miniSVG(s)}
    </div>`;
  }).join("");
</script>
</body>
</html>
